<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">
        <h1>Student Dashboard</h1>

        <div class="buttons">
            <button id="showBtn">Show Students</button>
            <button id="addBtn">Add Student</button>
            <button id="themeBtn">Change Theme</button>
        </div>

        <!-- Student details will appear here -->
        <div id="student-container"></div>

        <p id="message"></p>
    </div>

    <!-- Connect the JavaScript file -->
    <script src="script.js"></script>
</body>

</html>
